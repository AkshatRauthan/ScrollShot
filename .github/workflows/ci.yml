name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & vet (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test ./... -v -race

  windows-test:
    name: Test & vet (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /tmp/scrollshot-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/scrollshot

      - name: Vet (target platform)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  windows-runtime-check:
    name: Windows backend runtime check (real capture)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: windows-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o scrollshot.exe .\cmd\scrollshot

      - name: Open a window to capture, then run the Windows backend
        env:
          SCROLLSHOT_BACKEND: windows
        shell: pwsh
        run: |
          Start-Process notepad
          Start-Sleep -Seconds 2
          .\scrollshot.exe capture
          if ($LASTEXITCODE -ne 0) {
            throw "scrollshot capture failed with exit code $LASTEXITCODE"
          }

      - name: Verify a frame was actually written
        shell: pwsh
        run: |
          $frames = Get-ChildItem "$env:USERPROFILE\.cache\scrollshot_session\frame_*.png" -ErrorAction SilentlyContinue
          if (-not $frames) {
            throw "capture reported success but no frame file was found on disk"
          }
          Write-Host "Captured frame(s): $($frames.Name -join ', ')"

      - name: Clean up Notepad
        if: always()
        shell: pwsh
        run: Stop-Process -Name notepad -ErrorAction SilentlyContinue

  x11-runtime-check:
    name: X11 backend runtime check (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install virtual X server + minimal window manager
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xterm

      - name: Start Xvfb and openbox
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          export DISPLAY=:99
          openbox &
          sleep 2

      - name: Build
        run: go build -o /tmp/scrollshot ./cmd/scrollshot

      - name: Open a window to capture, then run the X11 backend
        env:
          DISPLAY: :99
          XDG_SESSION_TYPE: x11
          SCROLLSHOT_BACKEND: x11
        shell: bash
        run: |
          xterm -geometry 80x24+0+0 &
          sleep 2
          /tmp/scrollshot capture
          echo "capture succeeded — X11 backend produced output"