name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the full test suite on the exact tagged commit before building
  # or publishing anything. CI passing on `main` earlier doesn't
  # guarantee the tagged commit is the one that was checked (a tag can
  # point anywhere) — this is cheap insurance against publishing a
  # release built from an untested commit.
  test:
    name: Test & vet (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz

          - goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

          - goos: windows
            goarch: arm64
            ext: '.exe'
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/scrollshot${{ matrix.ext }} \
            ./cmd/scrollshot

          cp README.md LICENSE dist/

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd dist
          tar -czf ../scrollshot-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            scrollshot${{ matrix.ext }} \
            README.md \
            LICENSE

      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb and .rpm packages
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
          # Debian/RPM versions conventionally drop the leading "v" from the tag.
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          nfpm package --config nfpm.yaml --packager deb \
            --target scrollshot-${{ matrix.goarch }}.deb
          nfpm package --config nfpm.yaml --packager rpm \
            --target scrollshot-${{ matrix.goarch }}.rpm

      - name: Upload .deb/.rpm artifacts
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: scrollshot-${{ matrix.goarch }}-packages
          path: |
            scrollshot-${{ matrix.goarch }}.deb
            scrollshot-${{ matrix.goarch }}.rpm

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          zip ../scrollshot-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            scrollshot${{ matrix.ext }} \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollshot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: scrollshot-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract this version's changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"

          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > changelog_section.md

          if [ ! -s changelog_section.md ]; then
            echo "_No changelog entry found for this version._" > changelog_section.md
          fi

      - name: Assemble release notes
        run: |
          cat > RELEASE_NOTES.md << 'HEADER'
          Native scrolling screenshots — cross-platform CLI tool. See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for setup and usage.

          ## 📦 Downloads

          | File | Platform | Architecture |
          |---|---|---|
          | `scrollshot-linux-amd64.tar.gz` | Linux (any distro) | x64 |
          | `scrollshot-amd64.deb` | Debian, Ubuntu, Mint, Pop!_OS, etc. | x64 |
          | `scrollshot-amd64.rpm` | Fedora, openSUSE, RHEL, etc. | x64 |
          | `scrollshot-windows-amd64.zip` | Windows | x64 |
          | `scrollshot-windows-arm64.zip` | Windows | ARM64 |

          Not sure which one you need? See the platform support table in the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#platform-support).

          ## 🚀 Installation

          **Linux (Debian/Ubuntu-based):**
          ```bash
          sudo dpkg -i scrollshot-amd64.deb
          ```

          **Linux (Fedora/openSUSE-based):**
          ```bash
          sudo rpm -i scrollshot-amd64.rpm
          ```

          **Linux (any distro, no package manager):**
          ```bash
          tar -xzf scrollshot-linux-amd64.tar.gz
          chmod +x scrollshot
          sudo mv scrollshot /usr/local/bin/
          ```

          **Windows:**
          1. Download the `.zip` for your architecture (x64 or arm64).
          2. Extract `scrollshot.exe` anywhere.
          3. Optionally add it to your `PATH` to run it from any terminal.

          Each archive also includes the project README and LICENSE.

          Verify your download against `SHA256SUMS.txt` (also attached below) if you want to confirm integrity before running it.

          ## 🛠 Tech Stack

          - Built with Go — no runtime dependencies beyond the OS itself
          - Capture backends: `gnome-screenshot`, D-Bus `xdg-desktop-portal`, pure-Go X11 protocol, raw Win32 syscalls
          - See [`docs/architecture.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/architecture.md) and [`docs/capturing.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/capturing.md) for implementation details.

          ## ✨ What's New

          HEADER

          cat changelog_section.md >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)" >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Scrollshot ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      - name: Checkout main (for Scoop manifest commit)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Update Scoop manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          AMD64_HASH=$(grep 'scrollshot-windows-amd64.zip' artifacts/SHA256SUMS.txt | awk '{print $1}')
          ARM64_HASH=$(grep 'scrollshot-windows-arm64.zip' artifacts/SHA256SUMS.txt | awk '{print $1}')
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          jq \
            --arg version "$VERSION" \
            --arg amd64_url "$REPO_URL/scrollshot-windows-amd64.zip" \
            --arg amd64_hash "$AMD64_HASH" \
            --arg arm64_url "$REPO_URL/scrollshot-windows-arm64.zip" \
            --arg arm64_hash "$ARM64_HASH" \
            '.version = $version
             | .architecture."64bit".url = $amd64_url
             | .architecture."64bit".hash = $amd64_hash
             | .architecture."arm64".url = $arm64_url
             | .architecture."arm64".hash = $arm64_hash' \
            main-branch/bucket/scrollshot.json > main-branch/bucket/scrollshot.json.tmp
          mv main-branch/bucket/scrollshot.json.tmp main-branch/bucket/scrollshot.json

      - name: Commit updated Scoop manifest
        run: |
          cd main-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/scrollshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump Scoop manifest to ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi